<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Course Registration System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <script>
        // Login Debug Helper Script
// Add this to the very top of your login.html file to debug issues

console.log('🔍 DEBUG: Starting login debug helper...');

// 1. Check if all required libraries are loaded
document.addEventListener('DOMContentLoaded', function() {
    console.log('🔍 DEBUG: DOM Content Loaded');
    
    // Check if ethers is available
    if (typeof ethers !== 'undefined') {
        console.log('✅ DEBUG: Ethers.js is loaded');
    } else {
        console.error('❌ DEBUG: Ethers.js is NOT loaded');
    }
    
    // Check if CONTRACT_CONFIG is available
    if (typeof CONTRACT_CONFIG !== 'undefined') {
        console.log('✅ DEBUG: CONTRACT_CONFIG is loaded');
        console.log('🔍 DEBUG: Contract addresses:', CONTRACT_CONFIG.ADDRESSES);
    } else {
        console.error('❌ DEBUG: CONTRACT_CONFIG is NOT loaded');
    }
    
    // Check if MetaMask is available
    if (typeof window.ethereum !== 'undefined') {
        console.log('✅ DEBUG: MetaMask/Web3 provider is available');
        console.log('🔍 DEBUG: Provider info:', {
            isMetaMask: window.ethereum.isMetaMask,
            selectedAddress: window.ethereum.selectedAddress,
            chainId: window.ethereum.chainId
        });
    } else {
        console.error('❌ DEBUG: MetaMask/Web3 provider is NOT available');
    }
    
    // Check connect button
    const connectBtn = document.getElementById('connect-metamask');
    if (connectBtn) {
        console.log('✅ DEBUG: Connect button found');
        
        // Add debug click listener
        connectBtn.addEventListener('click', function() {
            console.log('🔍 DEBUG: Connect button clicked!');
        });
    } else {
        console.error('❌ DEBUG: Connect button NOT found');
    }
    
    // Check messages div
    const messagesDiv = document.getElementById('messages');
    if (messagesDiv) {
        console.log('✅ DEBUG: Messages div found');
    } else {
        console.error('❌ DEBUG: Messages div NOT found');
    }
    
    // Test basic functionality
    setTimeout(() => {
        console.log('🔍 DEBUG: Testing after 2 seconds...');
        
        // Try to call functions from login.js
        if (typeof verifySession === 'function') {
            console.log('✅ DEBUG: verifySession function is available');
        } else {
            console.error('❌ DEBUG: verifySession function is NOT available');
        }
        
        if (typeof connectMetaMask === 'function') {
            console.log('✅ DEBUG: connectMetaMask function is available');
        } else {
            console.error('❌ DEBUG: connectMetaMask function is NOT available');
        }
    }, 2000);
});

// 2. Check for any JavaScript errors
window.addEventListener('error', function(e) {
    console.error('❌ DEBUG: JavaScript Error:', {
        message: e.message,
        filename: e.filename,
        lineno: e.lineno,
        colno: e.colno,
        error: e.error
    });
});

// 3. Check for unhandled promise rejections
window.addEventListener('unhandledrejection', function(e) {
    console.error('❌ DEBUG: Unhandled Promise Rejection:', e.reason);
});

// 4. Monitor localStorage/sessionStorage access
const originalSetItem = Storage.prototype.setItem;
Storage.prototype.setItem = function(key, value) {
    console.log('🔍 DEBUG: Setting storage item:', key, value);
    return originalSetItem.call(this, key, value);
};

// 5. Test network connectivity
fetch(window.location.origin + '/scripts/config.js')
    .then(response => {
        if (response.ok) {
            console.log('✅ DEBUG: Network connectivity is working');
        } else {
            console.error('❌ DEBUG: Network response not OK:', response.status);
        }
    })
    .catch(error => {
        console.error('❌ DEBUG: Network fetch failed:', error);
    });

console.log('🔍 DEBUG: Debug helper script completed');

// Add a test function you can call manually
window.debugTest = function() {
    console.log('🧪 DEBUG: Manual test function called');
    console.log('Current URL:', window.location.href);
    console.log('Document ready state:', document.readyState);
    console.log('All script tags:', Array.from(document.scripts).map(s => s.src));
    
    // Test MetaMask connection manually
    if (window.ethereum) {
        window.ethereum.request({ method: 'eth_accounts' })
            .then(accounts => {
                console.log('🔍 DEBUG: MetaMask accounts:', accounts);
            })
            .catch(error => {
                console.error('❌ DEBUG: MetaMask error:', error);
            });
    }
    
    return 'Debug test completed - check console for results';
};

console.log('🔍 DEBUG: You can run debugTest() in console to run manual tests');
    </script>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-graduation-cap me-2"></i>
                Course Registration System
            </a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg">
                    <div class="card-header bg-primary text-white text-center py-3">
                        <h4 class="mb-0"><i class="fas fa-wallet me-2"></i>Wallet Authentication</h4>
                    </div>
                    <div class="card-body p-4">
                        
                        <!-- Wallet Connection Section -->
                        <div id="wallet-connection-section">
                            <div class="text-center mb-4">
                                <i class="fas fa-link fa-3x text-primary mb-3"></i>
                                <h5>Connect Your Wallet</h5>
                                <p class="text-muted">Secure authentication using your MetaMask wallet</p>
                            </div>
                            
                            <div class="d-grid mb-3">
                                <button type="button" class="btn btn-warning btn-lg" id="connect-metamask">
                                    <i class="fab fa-ethereum me-2"></i>Connect MetaMask
                                </button>
                            </div>
                            
                            <!-- Wallet Connected Status -->
                            <div id="wallet-connected-status" class="d-none">
                                <div class="alert alert-success">
                                    <i class="fas fa-check-circle me-2"></i>
                                    <strong>Wallet Connected</strong><br>
                                    <span class="font-monospace" id="connected-address"></span>
                                </div>
                            </div>
                        </div>

                        <!-- Messages Container -->
                        <div id="messages"></div>
                    </div>
                    
                    <div class="card-footer bg-light py-3">
                        <div class="text-center">
                            <p class="mb-0 text-muted small">
                                <i class="fas fa-shield-alt me-1"></i>
                                Secure wallet-based authentication
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script src="scripts/config.js"></script>
    <script src="scripts/login.js"></script>
    
</body>
</html>
