<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Course Registration System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-graduation-cap me-2"></i>
                Course Registration System
            </a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg">
                    <div class="card-header bg-primary text-white text-center py-3">
                        <h4 class="mb-0"><i class="fas fa-wallet me-2"></i>Wallet Authentication</h4>
                    </div>
                    <div class="card-body p-4">
                        
                        <!-- Wallet Connection Section -->
                        <div id="wallet-connection-section">
                            <div class="text-center mb-4">
                                <i class="fas fa-link fa-3x text-primary mb-3"></i>
                                <h5>Connect Your Wallet</h5>
                                <p class="text-muted">Secure authentication using your MetaMask wallet</p>
                            </div>
                            
                            <div class="d-grid mb-3">
                                <button type="button" class="btn btn-warning btn-lg" id="connect-metamask">
                                    <i class="fab fa-ethereum me-2"></i>Connect MetaMask
                                </button>
                            </div>
                            
                            <!-- Wallet Connected Status -->
                            <div id="wallet-connected-status" class="d-none">
                                <div class="alert alert-success">
                                    <i class="fas fa-check-circle me-2"></i>
                                    <strong>Wallet Connected</strong><br>
                                    <span class="font-monospace" id="connected-address"></span>
                                </div>
                            </div>
                        </div>

                        <!-- Messages Container -->
                        <div id="messages"></div>
                    </div>
                    
                    <div class="card-footer bg-light py-3">
                        <div class="text-center">
                            <p class="mb-0 text-muted small">
                                <i class="fas fa-shield-alt me-1"></i>
                                Secure wallet-based authentication
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script src="scripts/config.js"></script>
    <script src="scripts/login.js"></script>
</body>
</html>
